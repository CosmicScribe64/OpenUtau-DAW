name: Build community release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag and archive version
        required: true
        default: v0.1.0-alpha.2

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  container-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "docs/releases/$RELEASE_TAG.md"
          ./scripts/validate-github-release-tag.sh \
            "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_REPOSITORY" annotated
      - run: docker compose build dev
      - run: docker compose run --rm dev ./scripts/ci.sh

  windows-x64:
    needs: container-verification
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 8.0.424
      - name: Build and test Windows VST3
        shell: pwsh
        run: ./scripts/ci-windows.ps1
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/package-windows.ps1 -PackageVersion $env:RELEASE_TAG
      - name: Open embedded editor from packaged VST3
        shell: pwsh
        run: |
          $smoke = Get-ChildItem .build/windows -Recurse `
            -Filter "OpenUtau DAW smoke host.exe" | Select-Object -First 1
          if ($null -eq $smoke) { throw "Packaged-editor smoke host was not built." }
          $module = "artifacts/windows-x64/OpenUtau DAW.vst3/Contents/x86_64-win/OpenUtau DAW.vst3"
          if (!(Test-Path $module)) { throw "Packaged VST3 module was not found." }
          $env:OPENUTAU_VST_TEST_CREATE_EDITOR = "1"
          & $smoke.FullName $module
          if ($LASTEXITCODE -ne 0) { throw "Embedded Windows editor smoke test failed." }
          Remove-Item Env:OPENUTAU_VST_TEST_CREATE_EDITOR
      - name: Run Steinberg VST3 validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git .build/vst3sdk
          if ($LASTEXITCODE -ne 0) { throw "Steinberg SDK clone failed." }
          git -C .build/vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          if ($LASTEXITCODE -ne 0) { throw "Steinberg SDK checkout failed." }
          git -C .build/vst3sdk submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "Steinberg SDK submodule checkout failed." }
          cmake -S .build/vst3sdk -B .build/vst3sdk-build -A x64 -DSMTG_CREATE_PLUGIN_LINK=0
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator configure failed." }
          cmake --build .build/vst3sdk-build --config Release --target validator
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator build failed." }
          $validator = Get-ChildItem .build/vst3sdk-build -Recurse -Filter validator.exe | Select-Object -First 1
          if ($null -eq $validator) { throw "Steinberg validator executable was not built." }
          & $validator.FullName "artifacts/windows-x64/OpenUtau DAW.vst3"
          if ($LASTEXITCODE -ne 0) { throw "Steinberg VST3 validation failed." }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: OpenUtau-DAW-${{ env.RELEASE_TAG }}-windows-x64
          retention-days: 30
          path: |
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-windows-x64.zip
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-windows-x64.zip.sha256

  linux-x64:
    needs: container-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - run: docker compose build dev
      - name: Build and package Linux x64 VST3
        run: >-
          docker compose run --rm
          -e ARCHITECTURE=x64
          -e PACKAGE_VERSION=$RELEASE_TAG
          dev ./scripts/package-linux.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: OpenUtau-DAW-${{ env.RELEASE_TAG }}-linux-x64
          retention-days: 30
          path: |
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-linux-x64.zip
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-linux-x64.zip.sha256

  macos-arm64:
    needs: container-verification
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 8.0.424
      - name: Build ad-hoc-signed macOS arm64 package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          MANAGED_PUBLISH_MODE=host \
          PACKAGE_TOOL_MODE=host \
          PACKAGE_VERSION="$RELEASE_TAG" \
          BUILD_DIRECTORY="$GITHUB_WORKSPACE/.build/macos-arm64-release" \
          OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/artifacts/macos-arm64-release" \
          CODESIGN_IDENTITY="-" \
          NOTARIZE=0 \
          ./scripts/package-macos.sh
      - name: Create complete corresponding-source archive
        shell: bash
        run: |
          set -euo pipefail
          JUCE_SOURCE_DIR="$GITHUB_WORKSPACE/.build/macos-arm64-release/_deps/juce-src" \
            ./scripts/package-source.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-arm64-and-source
          retention-days: 30
          path: |
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-arm64.zip
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-arm64.zip.sha256
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-source.tar.gz
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-source.tar.gz.sha256

  macos-x64:
    needs: container-verification
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 8.0.424
      - name: Build ad-hoc-signed macOS Intel package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          ARCHITECTURE=x64 \
          MANAGED_PUBLISH_MODE=host \
          PACKAGE_TOOL_MODE=host \
          PACKAGE_VERSION="$RELEASE_TAG" \
          BUILD_DIRECTORY="$GITHUB_WORKSPACE/.build/macos-x64-release" \
          OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/artifacts/macos-x64-release" \
          CODESIGN_IDENTITY="-" \
          NOTARIZE=0 \
          ./scripts/package-macos.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-x64
          retention-days: 30
          path: |
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-x64.zip
            artifacts/OpenUtau-DAW-${{ env.RELEASE_TAG }}-macos-x64.zip.sha256

  draft-release:
    needs: [windows-x64, linux-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: OpenUtau-DAW-${{ env.RELEASE_TAG }}-*
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c "OpenUtau-DAW-$RELEASE_TAG-macos-arm64.zip.sha256"
          sha256sum -c "OpenUtau-DAW-$RELEASE_TAG-macos-x64.zip.sha256"
          sha256sum -c "OpenUtau-DAW-$RELEASE_TAG-windows-x64.zip.sha256"
          sha256sum -c "OpenUtau-DAW-$RELEASE_TAG-linux-x64.zip.sha256"
          sha256sum -c "OpenUtau-DAW-$RELEASE_TAG-source.tar.gz.sha256"
      - name: Create or update draft GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-macos-arm64.zip"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-macos-arm64.zip.sha256"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-macos-x64.zip"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-macos-x64.zip.sha256"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-windows-x64.zip"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-windows-x64.zip.sha256"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-linux-x64.zip"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-linux-x64.zip.sha256"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-source.tar.gz"
            "artifacts/OpenUtau-DAW-$RELEASE_TAG-source.tar.gz.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != true ]]; then
              echo "Refusing to overwrite assets on non-draft release $RELEASE_TAG." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --title "OpenUtau DAW $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md" \
              --draft --prerelease
          fi
